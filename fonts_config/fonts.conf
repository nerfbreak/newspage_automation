<?xml version="1.0"?>
<fontconfig>
  <!-- Search bundled fonts, XDG fonts, user home fonts, and tmp fonts -->
  <dir prefix="default">fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/tmp/fonts</dir>

  <!-- Writable cache directory in container environments -->
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <config>
    <rescan>
      <int>30</int>
    </rescan>
  </config>

  <!-- Default fallback to Liberation Sans -->
  <match target="pattern">
    <edit name="family" mode="prepend_first">
      <string>Liberation Sans</string>
    </edit>
  </match>

  <!-- Standard font aliases mapped to bundled Liberation fonts -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Verdana</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
